services:
  whale-checker:
    build: .
    container_name: whale-checker
    restart: unless-stopped
    # Both files are optional: a fresh clone with neither file still boots and
    # serves the committed snapshot. Add `environment .env` (or `.env`) with an
    # ETHERSCAN_API_KEY for live, continuously-updating data.
    env_file:
      - path: "environment .env"  # ETHERSCAN_API_KEY, WHALE_THRESHOLD_USD, POLL_INTERVAL_SECONDS
        required: false
      - path: ".env"
        required: false
    environment:
      # One-time history depth scanned on first boot (then the poll loop takes
      # over). Set BOOTSTRAP_BLOCKS=0 to disable, FORCE_BACKFILL=1 to re-run.
      BOOTSTRAP_BLOCKS: "${BOOTSTRAP_BLOCKS:-2000}"
      FORCE_BACKFILL: "${FORCE_BACKFILL:-0}"
    volumes:
      # Host `./data` holds whale_alert.db, shared read/write with Grafana below.
      - ./data:/app/data:rw

  grafana:
    image: grafana/grafana:11.1.1
    container_name: whale-grafana
    restart: unless-stopped
    environment:
      # Community SQLite data source plugin (official Grafana ships no SQLite conn)
      # + Percentage Trend panel (nikosc-percenttrend-panel). NOTE: the user-requested
      # "grafana-percentage-trend-panel" is the display name; the downloadable plugin id
      # (Grafana Labs) is "nikosc-percenttrend-panel", used here so it actually installs.
      GF_INSTALL_PLUGINS: frser-sqlite-datasource,nikosc-percenttrend-panel
      GF_PLUGINS_PREINSTALL: frser-sqlite-datasource,nikosc-percenttrend-panel
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Public snapshot sharing (Share -> Snapshot -> Publish to snapshots.raintank.io)
      GF_SNAPSHOTS_ENABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_SNAPSHOT_URL: https://snapshots.raintank.io
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    volumes:
      # Same SQLite file that whale-checker writes to. Mount rw so SQLite can
      # create/refresh the WAL shared-memory (-shm) file when reading.
      - ./data:/data:rw
      # Auto-load the SQLite data source + dashboard definitions on boot.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - whale-checker