apiVersion: 1

providers:
  # Auto-load every dashboard JSON found in the mounted dashboards folder.
  - name: "whale-dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false